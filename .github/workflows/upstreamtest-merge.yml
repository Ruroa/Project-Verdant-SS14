name: Resolve Upstreamtest Merge

on:
  pull_request:
    types: [reopened]
    branches:
      - LoujackalTesting

permissions:
  contents: write

jobs:
  resolve-upstream:
    if: github.head_ref == 'LoujackalTesting-UpstreamMerge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting-UpstreamMerge
          fetch-depth: 0
          submodules: false

      - name: Merge Upstreamtest with selected conflict rules
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Project Verdant Upstream Merge"
          git config user.email "upstream-merge@invalid.local"
          git fetch origin LoujackalTesting Upstreamtest LoujackalTesting-UpstreamMerge

          set +e
          git merge --no-commit --no-ff origin/Upstreamtest > /tmp/merge-output.txt 2>&1
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "The merge unexpectedly completed without conflicts."
          else
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            conflict_count=$(wc -l < /tmp/conflicts.txt | tr -d ' ')
            echo "Resolving ${conflict_count} conflict files."

            while IFS= read -r path; do
              [ -n "$path" ] || continue

              case "$path" in
                Content.Client/Paper/UI/*|Content.Server/Fax/*|Content.Shared/Fax/*)
                  selected_stage=3
                  selected_name="Starlight"
                  ;;
                *)
                  selected_stage=2
                  selected_name="Project Verdant"
                  ;;
              esac

              if git ls-files -u -- "$path" | awk -v stage="$selected_stage" '$3 == stage { found = 1 } END { exit !found }'; then
                if [ "$selected_stage" -eq 3 ]; then
                  git checkout --theirs -- "$path"
                else
                  git checkout --ours -- "$path"
                fi
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi

              echo "Resolved using ${selected_name}: ${path}"
            done < /tmp/conflicts.txt
          fi

          remaining=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')
          if [ "$remaining" -ne 0 ]; then
            echo "${remaining} unresolved conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git rm -f --ignore-unmatch \
            .github/merge-tests/upstreamtest-merge-results.txt \
            .github/workflows/upstreamtest-merge.yml

          git add -A
          git commit -m "Merge Upstreamtest with Project Verdant conflict rules"
          git push origin HEAD:LoujackalTesting-UpstreamMerge

          echo "Resolved merge pushed to LoujackalTesting-UpstreamMerge."
