name: Fix Remaining Upstream Build Errors

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.head_ref == 'LoujackalTesting-UpstreamMerge'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting-UpstreamMerge
          fetch-depth: 0
          submodules: recursive

      - name: Patch remaining compile errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          radio = Path('Content.Server/Radio/EntitySystems/RadioSystem.cs')
          text = radio.read_text(encoding='utf-8-sig')
          old = 'jobName = FormattedMessage.EscapeStringParameter(jobName); // Starlight: Prevent markup injection'
          new = r'jobName = FormattedMessage.EscapeText(jobName).Replace("\"", "\\\""); // Starlight: Prevent markup injection'
          if old not in text:
              raise SystemExit(f'Missing expected RadioSystem text: {old}')
          radio.write_text(text.replace(old, new, 1), encoding='utf-8')

          honeypot = Path('Content.Server/_Starlight/Honeypot/AdminNotifyOnDamageSystem.cs')
          text = honeypot.read_text(encoding='utf-8-sig')
          old = '        var links = $"[color=#ff0000]Click to [/color][cmdlink=\\"Warp to {FormattedMessage.EscapeStringParameter(entity.Comp.Subject)}\\" command=\\"tpto {GetNetEntity(entity.Owner)}\\"/]";'
          new = r'''        var escapedSubject = FormattedMessage.EscapeText(entity.Comp.Subject).Replace("\"", "\\\"");
          var links = $"[color=#ff0000]Click to [/color][cmdlink=\"Warp to {escapedSubject}\" command=\"tpto {GetNetEntity(entity.Owner)}\"/]";'''
          if old not in text:
              raise SystemExit('Missing expected honeypot cmdlink text')
          honeypot.write_text(text.replace(old, new, 1), encoding='utf-8')

          roles = Path('Content.Server/_NullLink/PlayerData/NullLinkPlayerManager.Roles.cs')
          text = roles.read_text(encoding='utf-8-sig')
          old = 'RebuildTitle(_playerManager.GetSessionById(new NetUserId(ev.Player)), playerData);'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 NullLink RebuildTitle calls, found {count}')
          roles.write_text(text.replace(old, 'RebuildTitle(ev.Player, playerData);'), encoding='utf-8')
          PY

          if git grep -n 'FormattedMessage.EscapeStringParameter' -- Content.Server; then
            echo 'EscapeStringParameter calls remain in Content.Server'
            exit 1
          fi

          if git grep -n 'RebuildTitle(_playerManager.GetSessionById(new NetUserId(ev.Player))' -- Content.Server/_NullLink; then
            echo 'Old NullLink RebuildTitle calls remain'
            exit 1
          fi

      - name: Build solution
        id: build
        shell: bash
        run: |
          set +e
          dotnet build --nologo 2>&1 | tee upstream-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit fixes and result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Upstream Merge"
          git config user.email "upstream-merge@invalid.local"

          if [ "${{ steps.build.outputs.status }}" -ne 0 ]; then
            mkdir -p .github/diagnostics
            {
              echo "Build still failed after compatibility fixes."
              echo
              grep -E ': error [A-Z]+[0-9]+:' upstream-build.log || true
              echo
              tail -n 20 upstream-build.log
            } > .github/diagnostics/upstream-build-errors.txt
          else
            rm -f .github/diagnostics/upstream-build-errors.txt
          fi

          rm -f upstream-build.log
          git rm -f .github/workflows/fix-remaining-upstream-build-errors.yml
          git add -A

          if [ "${{ steps.build.outputs.status }}" -eq 0 ]; then
            git commit -m "Fix upstream merge compatibility errors"
          else
            git commit -m "Fix initial upstream merge build errors"
          fi

          git push origin HEAD:LoujackalTesting-UpstreamMerge
