name: Verify Final Upstream Build

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'LoujackalTesting-UpstreamMerge'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting-UpstreamMerge
          fetch-depth: 0
          submodules: recursive

      - name: Verify client sandbox compatibility
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'StringComparer' -- Content.Client; then
            echo 'Client-side StringComparer references remain.'
            exit 1
          fi

      - name: Build full solution
        shell: bash
        run: dotnet build --nologo

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Upstream Merge"
          git config user.email "upstream-merge@invalid.local"
          git rm -f .github/workflows/verify-final-upstream-build.yml
          git commit -m "Verify final upstream merge build"
          git push origin HEAD:LoujackalTesting-UpstreamMerge
