name: Fix Horos static grid

on:
  push:
    branches:
      - LoujackalTesting
    paths:
      - .github/workflows/fix-horos-static.yml

permissions:
  contents: write

jobs:
  patch-horos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LoujackalTesting
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting
          fetch-depth: 0

      - name: Make Horos Station static
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Resources/Maps/_PV/Stations/Horos.yml')
          text = path.read_text()
          lines = text.splitlines(keepends=True)

          start = next(i for i, line in enumerate(lines) if line.strip() == '- uid: 2')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('  - uid: ')), len(lines))

          block = lines[start:end]

          # Force static physics on the Horos Station grid.
          for i, line in enumerate(block):
              if line.strip() == 'bodyType: Dynamic':
                  indent = line[:len(line) - len(line.lstrip())]
                  newline = '\n' if line.endswith('\n') else ''
                  block[i] = f'{indent}bodyType: Static{newline}'

          # Remove Shuttle from Horos Station only. The Shuttle system is for movable grids
          # and can make a station grid behave like a dynamic shuttle even when serialized static.
          patched = []
          i = 0
          while i < len(block):
              if block[i].rstrip('\n') == '    - type: Shuttle':
                  i += 1
                  while i < len(block) and not block[i].startswith('    - type: '):
                      i += 1
                  continue
              patched.append(block[i])
              i += 1

          block_text = ''.join(patched)
          if 'name: Horos Station' not in block_text:
              raise RuntimeError('UID 2 is not Horos Station; refusing to patch')
          if 'bodyType: Static' not in block_text:
              raise RuntimeError('Horos Station grid is not static after patch')
          if '    - type: Shuttle' in block_text:
              raise RuntimeError('Horos Station still has Shuttle after patch')

          lines[start:end] = patched
          path.write_text(''.join(lines))
          PY

      - name: Verify SecCruiser stays dynamic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Resources/Maps/_PV/Stations/Horos.yml').read_text()
          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- uid: 41697')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('  - uid: ')), len(lines))
          block = '\n'.join(lines[start:end])
          assert 'name: Sec-Cruiser VTS-01' in block
          assert 'bodyType: Dynamic' in block
          assert '- type: Shuttle' in block
          assert 'inherent: True' in block
          assert 'enabled: True' in block
          PY

      - name: Commit map change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Project Verdant Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-horos-static.yml
          git add Resources/Maps/_PV/Stations/Horos.yml
          git commit -m "Make Horos Station grid static"
          git push origin HEAD:LoujackalTesting
