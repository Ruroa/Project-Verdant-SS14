name: Fix Prototype Duplicates And Diagnose

on:
  push:
    branches:
      - LoujackalTesting-UpstreamMerge

permissions:
  contents: write

jobs:
  fix-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting-UpstreamMerge
          fetch-depth: 0
          submodules: recursive

      - name: Remove known duplicate prototypes
        shell: bash
        run: |
          set -euo pipefail

          git rm -f \
            Resources/Prototypes/_Starlight/InventoryTemplates/Protogen/protogen_inventory_template.yml \
            Resources/Prototypes/_Starlight/InventoryTemplates/Protogen/arachnid_inventory_template.yml \
            Resources/Prototypes/_Starlight/InventoryTemplates/Protogen/cyclorite_inventory_template.yml \
            Resources/Prototypes/_Starlight/InventoryTemplates/Protogen/diona_inventory_template.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path('Resources/Prototypes/_FarHorizons/Damage/modifier_sets.yml')
          text = path.read_text(encoding='utf-8-sig')
          marker = '\n- type: damageModifierSet\n  id: Protogen'
          first = text.find(marker)
          second = text.find(marker, first + len(marker))
          structural = text.find('\n- type: damageModifierSet\n  id: StructuralReactorCasing', second)
          if first < 0 or second < 0 or structural < 0:
              raise SystemExit('Could not identify the duplicated damage modifier block')
          path.write_text(text[:second] + text[structural:], encoding='utf-8')
          PY

      - name: Locate missing prototype references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          report=.github/diagnostics/missing-prototype-references.txt
          : > "$report"
          ids=(
            BaseSecurityScienceCommandNanoTrasenContraband
            BaseRoboticistContraband
            MobVulpkaninDummy
            LockerSurgeon
            ClothingBackpackDuffelSyndicateBundleDeluxe
            LockerGeneticist
            BaseNanoTrasenContraband
            LockerNCT
            LockerMailLarge
            LockerVirologist
            LockerCoroner
            LockerRoboticist
            LockerCargoLarge
          )
          for id in "${ids[@]}"; do
            echo "===== $id =====" >> "$report"
            grep -RIn --include='*.yml' --include='*.yaml' -F "$id" Resources/Prototypes >> "$report" || true
            echo >> "$report"
          done

      - name: Build full solution
        shell: bash
        run: dotnet build --nologo

      - name: Test server prototype startup
        shell: bash
        run: |
          set +e
          timeout 120s dotnet run --project Content.Server --no-build > prototype-startup.log 2>&1
          status=$?
          {
            echo "Server startup exit status: $status"
            echo
            grep -E "Duplicate ID:|KeyNotFoundException|PrototypeLoadException|\[FATL\]|\[ERRO\] eng:" prototype-startup.log || true
            echo
            echo "--- final 80 lines ---"
            tail -n 80 prototype-startup.log
          } > .github/diagnostics/prototype-startup-result.txt
          exit 0

      - name: Commit cleanup and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Prototype Cleanup"
          git config user.email "prototype-cleanup@invalid.local"
          rm -f prototype-startup.log
          git rm -f .github/workflows/fix-prototype-duplicates-diagnose.yml
          git add -A
          git commit -m "Remove duplicate prototypes and diagnose missing parents"
          git push origin HEAD:LoujackalTesting-UpstreamMerge
