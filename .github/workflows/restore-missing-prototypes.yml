name: Restore Missing Prototypes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: github.head_ref == 'LoujackalTesting-UpstreamMerge'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting-UpstreamMerge
          fetch-depth: 0
          submodules: recursive

      - name: Restore missing prototype definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def append_blocks(path_string: str, blocks: list[tuple[str, str]]) -> None:
              path = Path(path_string)
              text = path.read_text(encoding='utf-8-sig').rstrip() + '\n'
              for prototype_id, block in blocks:
                  if f'id: {prototype_id}' in text:
                      continue
                  text += '\n' + block.strip() + '\n'
              path.write_text(text, encoding='utf-8')

          append_blocks(
              'Resources/Prototypes/_Starlight/Entities/Objects/base_contraband.yml',
              [
                  ('BaseRoboticistContraband', '''
          # Roboticist
          - type: entity
            id: BaseRoboticistContraband
            parent: BaseRestrictedContraband
            abstract: true
            components:
            - type: Contraband
              allowedJobs: [ Roboticist ]
          '''),
                  ('BaseNanoTrasenContraband', '''
          - type: entity
            id: BaseNanoTrasenContraband
            parent: BaseRestrictedContraband
            abstract: true
            components:
            - type: Contraband
              allowedDepartments: [ Representatives ]
          '''),
                  ('BaseSecurityScienceCommandNanoTrasenContraband', '''
          - type: entity
            id: BaseSecurityScienceCommandNanoTrasenContraband
            parent: BaseRestrictedContraband
            abstract: true
            components:
            - type: Contraband
              allowedDepartments: [ Security, Science, Command, Representatives ]
          '''),
              ],
          )

          append_blocks(
              'Resources/Prototypes/_Starlight/Entities/Structures/Storage/Closets/Lockers/lockers.yml',
              [
                  ('LockerNCT', '''
          # NCT
          - type: entity
            id: LockerNCT
            parent: LockerBaseSecure
            name: NanoTrasen career trainer's locker
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: nct
              stateDoorOpen: nanotrasen-black_open
              stateDoorClosed: nct_door
            - type: AccessReader
              access: [["Command"]]
            - type: WiresPanelSecurity
              securityLevel: medSecurity
          '''),
                  ('LockerCargoLarge', '''
          - type: entity
            id: LockerCargoLarge
            parent: LockerLargeBaseSecure
            name: large cargo technician's locker
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet-large.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: cargo
              stateDoorOpen: salvage_open
              stateDoorClosed: cargo_door
            - type: AccessReader
              access: [["Cargo"]]
          '''),
                  ('LockerMailLarge', '''
          - type: entity
            id: LockerMailLarge
            parent: LockerLargeBaseSecure
            name: large mail technician's locker
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet-large.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: mail
              stateDoorOpen: salvage_open
              stateDoorClosed: mail_door
            - type: AccessReader
              access: [["Mail"]]
          '''),
                  ('LockerSurgeon', '''
          - type: entity
            id: LockerSurgeon
            name: surgeon's locker
            parent: LockerBaseSecure
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: surgeon
              stateDoorOpen: robosurgeon-black_open
              stateDoorClosed: surgeon_door
            - type: AccessReader
              access: [["Surgery"]]
          '''),
                  ('LockerCoroner', '''
          - type: entity
            id: LockerCoroner
            name: coroner's locker
            parent: LockerBaseSecure
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: coroner
              stateDoorOpen: coroner_open
              stateDoorClosed: coroner_door
            - type: AccessReader
              access: [["Medical"]]
          '''),
                  ('LockerVirologist', '''
          - type: entity
            id: LockerVirologist
            name: virologist's locker
            parent: LockerBaseSecure
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: virologist
              stateDoorOpen: medical_open
              stateDoorClosed: virologist_door
            - type: AccessReader
              access: [["Medical"]]
          '''),
                  ('LockerGeneticist', '''
          - type: entity
            id: LockerGeneticist
            name: geneticist's locker
            parent: LockerBaseSecure
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: geneticist
              stateDoorOpen: medical_open
              stateDoorClosed: geneticist_door
            - type: AccessReader
              access: [["Medical"], ["Research"]]
          '''),
                  ('LockerRoboticist', '''
          - type: entity
            id: LockerRoboticist
            name: roboticist's locker
            parent: LockerBaseSecure
            components:
            - type: Appearance
            - type: Sprite
              sprite: _Starlight/Structures/Storage/closet.rsi
            - type: EntityStorageVisuals
              stateBaseClosed: roboticist
              stateDoorOpen: robosurgeon-black_open
              stateDoorClosed: roboticist_door
            - type: AccessReader
              access: [["Robotics"]]
          '''),
              ],
          )

          append_blocks(
              'Resources/Prototypes/_Starlight/Entities/Clothing/Back/duffel.yml',
              [
                  ('ClothingBackpackDuffelSyndicateDeluxe', '''
          - type: entity
            parent: [ClothingBackpackDuffel, BaseMinorContraband]
            id: ClothingBackpackDuffelSyndicateDeluxe
            name: deluxe syndicate duffel bag
            description: A huge duffel bag for holding an obscene amount of Syndicate goods.
            components:
            - type: Sprite
              sprite: Clothing/Back/Duffels/syndicate.rsi
            - type: ExplosionResistance
              damageCoefficient: 0.1
            - type: Storage
              grid:
              - 0,0,9,5
          '''),
                  ('ClothingBackpackDuffelSyndicateBundleDeluxe', '''
          - type: entity
            parent: [ ClothingBackpackDuffelSyndicateDeluxe, BaseMinorContraband ]
            id: ClothingBackpackDuffelSyndicateBundleDeluxe
            abstract: true
            components:
            - type: Tag
              tags: []
          '''),
              ],
          )

          gunsawian = Path('Resources/Prototypes/_Starlight/Entities/Mobs/Species/Gunsawian/base.yml')
          text = gunsawian.read_text(encoding='utf-8-sig')
          old = '  parent: MobVulpkaninDummy\n  id: MobGunsawianDummy'
          new = '  parent: BaseMobGunsawian\n  id: MobGunsawianDummy'
          if old not in text:
              raise SystemExit('Could not find the Gunsawian dummy parent to update')
          gunsawian.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Build full solution
        shell: bash
        run: dotnet build --nologo

      - name: Verify server prototype startup
        shell: bash
        run: |
          set +e
          timeout 120s dotnet run --project Content.Server --no-build > prototype-startup.log 2>&1
          status=$?
          mkdir -p .github/diagnostics
          {
            echo "Server startup exit status: $status"
            echo
            grep -E "Duplicate ID:|KeyNotFoundException|PrototypeLoadException|\[FATL\]|\[ERRO\] eng:" prototype-startup.log || true
            echo
            echo "--- final 100 lines ---"
            tail -n 100 prototype-startup.log
          } > .github/diagnostics/prototype-startup-result.txt
          exit 0

      - name: Commit restoration and verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Prototype Restore"
          git config user.email "prototype-restore@invalid.local"
          rm -f prototype-startup.log
          rm -f .github/diagnostics/missing-prototype-references.txt
          git rm -f .github/workflows/restore-missing-prototypes.yml
          git add -A
          git commit -m "Restore missing runtime prototypes"
          git push origin HEAD:LoujackalTesting-UpstreamMerge
