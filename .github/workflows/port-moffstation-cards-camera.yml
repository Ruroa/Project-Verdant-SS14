name: Port Moffstation cards and camera

on:
  push:
    branches:
      - LoujackalTesting
    paths:
      - .github/workflows/port-moffstation-cards-camera.yml

permissions:
  contents: write

jobs:
  port-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Project Verdant Automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch Starlight feature commits
        run: |
          git remote add starlight https://github.com/ss14Starlight/space-station-14.git
          for sha in \
            f280d05afc341b7ffa11a3ec83aded61ede33dd3 \
            661c1a4b742d3abb4084f7bd6802de7e34408af3 \
            74dedf65671a1449882c3a633377be34e5bb5461 \
            c922ee5eb580d7850f3e539b606a47641561451a \
            644db33ffc1ba7b64646c1e0f2db796372f9d039 \
            31495508c3bc87adb3c78cedd6b6e449c1b92555
          do
            git fetch --no-tags starlight "$sha"
          done

      - name: Cherry-pick feature integration commits
        run: |
          git cherry-pick f280d05afc341b7ffa11a3ec83aded61ede33dd3
          git cherry-pick 661c1a4b742d3abb4084f7bd6802de7e34408af3
          git cherry-pick 74dedf65671a1449882c3a633377be34e5bb5461
          git cherry-pick -m 1 c922ee5eb580d7850f3e539b606a47641561451a
          git cherry-pick 644db33ffc1ba7b64646c1e0f2db796372f9d039

      - name: Overlay current Starlight feature files
        run: |
          git worktree add --detach /tmp/starlight-current 31495508c3bc87adb3c78cedd6b6e449c1b92555

          mkdir -p Content.Client/_Moffstation/Cards
          mkdir -p Content.Client/_Moffstation/GameObjects
          mkdir -p Content.Server/_Moffstation/Cards
          mkdir -p Content.Shared/_Moffstation/Cards
          mkdir -p Content.Shared/_Moffstation/Extensions
          mkdir -p Content.Shared/_Moffstation/Strip/Components
          mkdir -p Resources/Audio/_Moffstation/Effects/Cards
          mkdir -p Resources/Locale/en-US/_Moffstation/cards
          mkdir -p Resources/Locale/en-US/_Starlight/cards
          mkdir -p Resources/Prototypes/_Moffstation/Entities/Objects/Misc/Cards
          mkdir -p Resources/Prototypes/_Moffstation/Entities/Objects/Tools
          mkdir -p Resources/Prototypes/_Moffstation/SoundCollections
          mkdir -p Resources/Textures/_Moffstation/Objects/Misc/Cards
          mkdir -p Resources/Textures/_Moffstation/Objects/Tools

          rsync -a /tmp/starlight-current/Content.Client/_Moffstation/Cards/ Content.Client/_Moffstation/Cards/
          cp /tmp/starlight-current/Content.Client/_Moffstation/GameObjects/ManagedLayerVisualizerSystem.cs Content.Client/_Moffstation/GameObjects/
          rsync -a /tmp/starlight-current/Content.Server/_Moffstation/Cards/ Content.Server/_Moffstation/Cards/
          rsync -a /tmp/starlight-current/Content.Shared/_Moffstation/Cards/ Content.Shared/_Moffstation/Cards/
          cp /tmp/starlight-current/Content.Shared/_Moffstation/Extensions/EntitySystemExt.cs Content.Shared/_Moffstation/Extensions/
          cp /tmp/starlight-current/Content.Shared/_Moffstation/Extensions/ISealedInheritance.cs Content.Shared/_Moffstation/Extensions/
          cp /tmp/starlight-current/Content.Shared/_Moffstation/Extensions/SpriteExt.cs Content.Shared/_Moffstation/Extensions/
          cp /tmp/starlight-current/Content.Shared/_Moffstation/Extensions/VerbExt.cs Content.Shared/_Moffstation/Extensions/
          cp /tmp/starlight-current/Content.Shared/_Moffstation/Strip/Components/HideInStripMenuComponent.cs Content.Shared/_Moffstation/Strip/Components/

          rsync -a /tmp/starlight-current/Resources/Audio/_Moffstation/Effects/Cards/ Resources/Audio/_Moffstation/Effects/Cards/
          rsync -a /tmp/starlight-current/Resources/Locale/en-US/_Moffstation/cards/ Resources/Locale/en-US/_Moffstation/cards/
          cp /tmp/starlight-current/Resources/Locale/en-US/_Starlight/cards/cards.ftl Resources/Locale/en-US/_Starlight/cards/
          rsync -a /tmp/starlight-current/Resources/Prototypes/_Moffstation/Entities/Objects/Misc/Cards/ Resources/Prototypes/_Moffstation/Entities/Objects/Misc/Cards/
          cp /tmp/starlight-current/Resources/Prototypes/_Moffstation/Entities/Objects/Tools/handheld_camera.yml Resources/Prototypes/_Moffstation/Entities/Objects/Tools/
          cp /tmp/starlight-current/Resources/Prototypes/_Moffstation/SoundCollections/cards.yml Resources/Prototypes/_Moffstation/SoundCollections/
          rsync -a /tmp/starlight-current/Resources/Textures/_Moffstation/Objects/Misc/Cards/ Resources/Textures/_Moffstation/Objects/Misc/Cards/
          rsync -a /tmp/starlight-current/Resources/Textures/_Moffstation/Objects/Tools/handheld_camera.rsi/ Resources/Textures/_Moffstation/Objects/Tools/handheld_camera.rsi/

          python3 - <<'PY'
          from pathlib import Path

          path = Path('Resources/Prototypes/_Starlight/Entities/Objects/base_contraband.yml')
          text = path.read_text(encoding='utf-8-sig')
          if 'id: BaseReporterContraband' not in text:
              marker = '# for ~objective items not held by command'
              block = '''- type: entity\n  id: BaseReporterContraband\n  parent: BaseRestrictedContraband\n  abstract: true\n  components:\n  - type: Contraband\n    allowedJobs: [ Reporter ]\n\n'''
              if marker not in text:
                  raise RuntimeError('Could not find insertion point for BaseReporterContraband')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git add Content.Client/_Moffstation Content.Server/_Moffstation Content.Shared/_Moffstation \
            Resources/Audio/_Moffstation/Effects/Cards \
            Resources/Locale/en-US/_Moffstation/cards Resources/Locale/en-US/_Starlight/cards/cards.ftl \
            Resources/Prototypes/_Moffstation Resources/Prototypes/_Starlight/Entities/Objects/base_contraband.yml \
            Resources/Textures/_Moffstation/Objects/Misc/Cards Resources/Textures/_Moffstation/Objects/Tools/handheld_camera.rsi

          if ! git diff --cached --quiet; then
            git commit -m "Sync current Starlight cards and handheld camera files"
          fi

      - name: Remove one-time workflow and push
        run: |
          git rm .github/workflows/port-moffstation-cards-camera.yml
          git commit -m "Remove one-time Moffstation port workflow"
          git push origin HEAD:LoujackalTesting
