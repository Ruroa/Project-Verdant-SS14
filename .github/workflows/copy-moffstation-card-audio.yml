name: Copy Moffstation card audio

on:
  push:
    branches:
      - LoujackalTesting
    paths:
      - .github/workflows/copy-moffstation-card-audio.yml

permissions:
  contents: write

jobs:
  copy-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: LoujackalTesting
          fetch-depth: 0

      - name: Copy card audio from Starlight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Automation"
          git config user.email "actions@users.noreply.github.com"
          git remote add starlight https://github.com/ss14Starlight/space-station-14.git
          git fetch --no-tags starlight 31495508c3bc87adb3c78cedd6b6e449c1b92555
          git checkout FETCH_HEAD -- Resources/Audio/_Moffstation/Effects/Cards
          git rm .github/workflows/copy-moffstation-card-audio.yml
          git add Resources/Audio/_Moffstation/Effects/Cards
          git commit -m "Add Moffstation card audio"
          git push origin HEAD:LoujackalTesting
