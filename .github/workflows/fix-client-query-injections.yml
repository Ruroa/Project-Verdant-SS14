name: Fix Client Query Injections

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'LoujackalTesting-UpstreamMerge'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          ref: LoujackalTesting-UpstreamMerge
          fetch-depth: 0
          submodules: recursive

      - name: Fix tray scanner query compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Content.Client/SubFloor/TrayScannerSystem.cs')
          text = path.read_text(encoding='utf-8-sig')
          replacements = {
              '    [Dependency] private EntityQuery<TrayScannerComponent> _trayScannerQuery = default!; // starlight edit: removed readonly\n': '',
              '    [Dependency] private EntityQuery<SubFloorHideComponent> _subFloorHideQuery = default!; // starlight edit: removed readonly\n': '',
              'if (!_trayScannerQuery.TryGetComponent(item, out var scanner) || !scanner.Enabled)':
                  'if (!TryComp<TrayScannerComponent>(item, out var scanner) || !scanner.Enabled)',
              'if (_subFloorHideQuery.TryGetComponent(uid, out var subfloor) &&':
                  'if (TryComp<SubFloorHideComponent>(uid, out var subfloor) &&',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected TrayScanner text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          mkdir -p .github/diagnostics
          grep -RInE '\[Dependency\].*EntityQuery<' \
            Content.Client Content.Server Content.Shared \
            > .github/diagnostics/dependency-entity-queries.txt || true
          if [ -s .github/diagnostics/dependency-entity-queries.txt ]; then
            cat .github/diagnostics/dependency-entity-queries.txt
            echo 'Dependency-injected EntityQuery fields remain.'
            exit 1
          fi

      - name: Build full solution
        shell: bash
        run: dotnet build --nologo

      - name: Verify server remains healthy
        shell: bash
        run: |
          set +e
          timeout 90s dotnet run --project Content.Server --no-build > server-startup.log 2>&1
          status=$?
          {
            echo "Server startup exit status: $status"
            echo
            grep -E "Duplicate ID:|KeyNotFoundException|PrototypeLoadException|UnregisteredDependencyException|Unhandled exception|\[FATL\]|\[ERRO\] eng:" server-startup.log || true
            echo
            echo "--- final 80 lines ---"
            tail -n 80 server-startup.log
          } > .github/diagnostics/prototype-startup-result.txt
          exit 0

      - name: Commit final compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Runtime Fix"
          git config user.email "runtime-fix@invalid.local"
          rm -f server-startup.log
          rm -f .github/diagnostics/dependency-entity-queries.txt
          git rm -f .github/workflows/fix-client-query-injections.yml
          git add -A
          git commit -m "Fix client entity query runtime compatibility"
          git push origin HEAD:LoujackalTesting-UpstreamMerge
