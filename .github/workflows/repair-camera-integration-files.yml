name: Repair camera integration files

on:
  push:
    branches:
      - LoujackalTesting
    paths:
      - .github/workflows/repair-camera-integration-files.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: LoujackalTesting
          fetch-depth: 0

      - name: Restore exact pre-port files and apply minimal camera additions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Verdant Automation"
          git config user.email "actions@users.noreply.github.com"

          PRE_PORT=d2e6257c26b118321b0ca5d3b957677482377d3f
          git show "$PRE_PORT:Resources/Prototypes/Entities/Structures/Machines/lathe.yml" > Resources/Prototypes/Entities/Structures/Machines/lathe.yml
          git show "$PRE_PORT:Resources/Prototypes/Research/civilianservices.yml" > Resources/Prototypes/Research/civilianservices.yml

          python3 - <<'PY'
          from pathlib import Path

          lathe = Path('Resources/Prototypes/Entities/Structures/Machines/lathe.yml')
          text = lathe.read_text(encoding='utf-8-sig')
          if '    - WirelessCameraHandheld # Moffstation - handheld reporter camera' not in text:
              marker = '    - StarlightScienceWeapons\n'
              if marker not in text:
                  raise RuntimeError('Could not locate protolathe dynamic pack insertion point')
              text = text.replace(marker, marker + '    - WirelessCameraHandheld # Moffstation - handheld reporter camera\n', 1)
          lathe.write_text(text, encoding='utf-8')

          research = Path('Resources/Prototypes/Research/civilianservices.yml')
          text = research.read_text(encoding='utf-8-sig')
          if '  - SurveillanceWirelessCameraHandheld # Moffstation - wireless handheld camera' not in text:
              marker = '  - BladeServerRackMachineCircuitboard # Moffstation - Blade Server Rack constructible\n'
              if marker not in text:
                  raise RuntimeError('Could not locate civilian research insertion point')
              text = text.replace(marker, marker + '  - SurveillanceWirelessCameraHandheld # Moffstation - wireless handheld camera\n', 1)
          research.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/repair-camera-integration-files.yml
          git add Resources/Prototypes/Entities/Structures/Machines/lathe.yml Resources/Prototypes/Research/civilianservices.yml
          git commit -m "Repair handheld camera integration files"
          git push origin HEAD:LoujackalTesting
