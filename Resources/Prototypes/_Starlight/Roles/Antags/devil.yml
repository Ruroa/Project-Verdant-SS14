- type: antag
  id: Devil
  name: roles-antag-devil-name
  antagonist: true
  # Legacy-disabled: hidden from player preferences while Devil is inactive.
  setPreference: false
  objective: roles-antag-devil-objective
  guides: [ Devil ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10h
  - !type:SpeciesRequirement
    species:
    - IPC
    inverted: true
  playTimeTracker: AntagDevil

- type: antagSpecifier
