- type: entity
  parent: WeatherBase
  id: WeatherRadioactiveRain
  name: radioactive rain
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/_PV/Effects/weather.rsi
        state: radioactive_rain
      sound:
        path: /Audio/Effects/Weather/rain_heavy.ogg
        params:
          loop: true
          volume: -6
    - type: WeatherEffects
    - type: WeatherEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Radiation: 2

- type: entity
  parent: WeatherBase
  id: WeatherThunderstorm
  name: thunderstorm
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/Effects/weather.rsi
        state: storm
      sound:
        path: /Audio/Effects/Weather/rain_heavy.ogg
        params:
          loop: true
          volume: -6
    - type: ThunderstormLightning
      minStrikeInterval: 12
      maxStrikeInterval: 25
      mobTargetChance: 0.65
      shockDamage: 15
      electrocutionTime: 2

- type: entity
  parent: WeatherBase
  id: WeatherAuroraCaelus
  name: aurora caelus
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/_Starlight/Effects/weather.rsi
        state: starry_night
      sound:
        path: /Audio/_Starlight/Effects/Weather/aurora_caelus.ogg
        params:
          volume: 0
    - type: ParallaxStatusEffect
      parallax: AuroraCaelus

- type: entity
  parent: WeatherBase
  id: WeatherSpaceWhale
  name: space whale
  components:
    - type: ParallaxStatusEffect
      parallax: SpaceWhale

- type: entity
  parent: WeatherBase
  id: WeatherCosmic
  name: cosmic
  components:
    - type: ParallaxStatusEffect
      parallax: CosmicFinaleParallax

# a version of WeatherSnowfallHeavy with a LOT less fog
- type: entity
  parent: WeatherBase
  id: WeatherSnowfallLobster
  name: heavy snowfall with light fog
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_Starlight/Effects/weather.rsi
      state: snowfall_lobster
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -12 # quiet ambience rather than in-your-face wind
