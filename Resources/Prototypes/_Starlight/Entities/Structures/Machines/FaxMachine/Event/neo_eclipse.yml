# Group
- type: faxGroup
  id: FaxGroupNeoEclipse
  name: fax-group-neo-eclipse
  color: "#896e14"
  order: 1500 # All events: 1500
  selectable: false

# Single fax -- can be edited for mapping/event purposes.
- type: entity
  parent: FaxMachineBase
  id: FaxMachineNeoEclipse
  suffix: "Neo-Eclipse"
  categories: [ DoNotMap ]
  components:
    - type: Sprite
      layers:
        - state: icon
          map: [ "base" ]
          color: "#896e14"
    - type: FaxMachine
      group: FaxGroupNeoEclipse
      intrinsicGroup: FaxGroupNeoEclipse
      intrinsicLocked: true # No impersonating unless emagged
      name: "Neo-Eclipse"
      order: 500
