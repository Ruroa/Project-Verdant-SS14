    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: full
  - type: Thirst
  - type: Damageable
    damageContainer: Hybrid
    damageModifierSet: Protogen
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.SurgeryUIKey.Key:
        type: SurgeryBui
      enum.ThavenMoodsUiKey.Key:
        type: ThavenMoodsBoundUserInterface
        requireInputValidation: false
  - type: GlitchOnIonStorm
    duration: 25
    ramp: 3
  - type: HumanoidEMP
    effectCooldown: 2
    effect:
      stunAmount: 5.0
      knockdownAmount: 2.0
      slowdownAmount: 15.0
      walkSpeedModifier: 0.5
      sprintSpeedModifier: 0.5
      dropItemsFrom:
        - body_part_slot_right hand
        - body_part_slot_left hand
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 10
          Heat: 10
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 5
  - type: Body
    prototype: Protogen
    requiredLegs: 2
  - type: Tag
    tags:
      - CanPilot
      - FootstepSound
      - DoorBumpOpener
      - AnomalyHost
      - Protogen
      - SiliconEmotesFH
      - NotLabelable
      - TrueProtogen
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold : 0.1
    heatDamage:
      types:
        Heat : 1.5
  - type: TemperatureSpeed
    thresholds:
      293: 0.9
      280: 0.8
      260: 0.7
  - type: HumanoidAppearance
    species: Protogen
    hideLayersOnEquip:
    - Hair
  - type: Inventory
    speciesId: protogen
    templateId: protogen
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _FarHorizons/Mobs/Species/Protogen/displacement.rsi
            state: jumpsuit-female
  - type: Barotrauma
    protectionSlots:
    - head
    alternativeProtectionSlots:
    - - outerClothing
      - outerClothing2
    damage:
      types:
        Blunt: 0.9
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
    allowedEmotes: ['Chirp', 'Hisses', 'Squish', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk', 'Bark', 'Snarl', 'Whine', 'Howl', 'Yip', 'Mew', 'Meow','Thump', 'Liss', 'Lurr', 'Rattle', "Marr", "Wurble", 'Chitter', 'Squeak', 'Click', 'Beep', 'Ping', 'Buzz', 'Buzz-Two', 'Chime', 'Honk']
  - type: Vocal
    sounds:
      Male: ProtoHumanMSounds
      Female: ProtoHumanFSounds
      Unsexed: ProtoHumanMSounds
  - type: UniversalHealModifier
    modifier: 0.5

