- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRifleBigRubber
  name: ammunition box (5.56x45mm rubber)
  components:
  - type: BallisticAmmoProvider
    capacity: 200
    proto: CartridgeRifleRubber
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Boxes/556x45mm.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

