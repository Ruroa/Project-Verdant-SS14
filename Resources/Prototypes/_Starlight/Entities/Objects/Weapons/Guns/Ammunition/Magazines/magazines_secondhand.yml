# Second-hand (mixed-ammo) magazine variants for the Second Hand uplink tab.
# Each spawns with a random round count and a weighted mix of compatible ammo types
# (excluding armor-piercing), in shuffled order. Free in the uplink.

- type: entity
  parent: MagazinePistolHighCapacitySP # Starlight
  id: MagazinePistolHighCapacityWorn
  suffix: Second Hand
  components:
  - type: MixedAmmoFill
    minFillFraction: 0.7
    maxFillFraction: 1.0
    entries:
      - proto: CartridgePV9x19Ball # Starlight
        weight: 5
      - proto: CartridgePV9x19Incendiary
        weight: 2
      - proto: CartridgePV9x19Uranium
        weight: 1
      - proto: CartridgePV9x19Practice
        weight: 3
      - proto: CartridgePistolFoam
        weight: 2

