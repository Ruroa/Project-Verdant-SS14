# Neo-Eclipse tactical visor
- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseMajorContraband]
  id: ClothingEyesGlassesNeoEclipse
  name: Neo-Eclipse tactical visor
  description: A flash-resistant tactical visor issued to Neo-Eclipse Agents. Provides complete flash immunity and a security HUD.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/secglasses.rsi #WILL BE REPLACED AT A LATER DATE WHEN I HAVE SPRITES!!! - scarletlightweaver_ss14
  - type: Clothing
    sprite: Clothing/Eyes/Glasses/secglasses.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Hybrid

# Neo-Eclipse combat suit
- type: entity
  parent: [ClothingOuterBaseLarge, BaseMajorContraband]
  id: ClothingOuterCombatSuitNeoEclipse
  name: Neo-Eclipse combat suit
  description: A heavily armored combat suit issued to Neo-Eclipse Agents and Operatives. It is built to carry its wearer through an eradication directive, regardless of resistance.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/wardlord.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/wardlord.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
    staminaModifier: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHeavy
      params:
        volume: -6
        variation: 0.09
  - type: AllowSuitStorage
  - type: Tag
    tags:
    - MonkeyWearable
    - WhitelistChameleon
    - CorgiWearable
    - ScurretWearable
    - FootstepSound

# Neo-Eclipse combat helmet
- type: entity
  parent: [ClothingHeadHelmetArmoredBase, BaseMajorContraband]
  id: ClothingHeadHelmetNeoEclipse
  name: Neo-Eclipse combat helmet
  description: A reinforced combat helmet issued to Neo-Eclipse Agents and Operatives. It offers superior protection over standard combat gear.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/Blackmerc.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/Blackmerc.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.85
        Caustic: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: HideLayerClothing
    layers:
      Hair: HEAD

