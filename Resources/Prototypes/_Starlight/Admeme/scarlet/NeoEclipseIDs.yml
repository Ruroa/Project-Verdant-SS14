# Neo-Eclipse ID cards
- type: entity
  parent: IDCardStandard
  id: NeoEclipseIDCard
  name: Neo-Eclipse ID card
  components:
    - type: Sprite
      sprite: _PV/Objects/Misc/eclipse_id_cards.rsi
      layers:
        - state: EclipseL1
        - sprite: &neo-eclipse-icon-rsi _Starlight/Interface/Misc/job_icons.rsi
          offset: &neo-eclipse-icon-offset -0.09375, 0.0625
          state: NeoEclipse
    - type: IdCard
      jobTitle: job-name-neo-eclipse
      jobIcon: JobIconNeoEclipse
    - type: Access
      tags:
        - NeoEclipse

