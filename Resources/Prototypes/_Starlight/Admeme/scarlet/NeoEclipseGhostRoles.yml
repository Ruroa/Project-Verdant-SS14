    sprite: _Starlight/Admeme/Scarlet/wardlord.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: NeoEclipseInitiateSettings

- type: randomHumanoidSettings
  id: NeoEclipseAgent
  parent: EventHumanoid
  components:
  - type: GhostRole
    name: ghost-role-information-neo-eclipse-agent-name
    description: ghost-role-information-neo-eclipse-agent-description
    rules: ghost-role-information-antagonist-rules
    raffle:
      settings: default
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: AntagImmune
  - type: NoObjectiveTarget
  - type: Loadout
    prototypes: [ NeoEclipseAgentGear ]
  - type: RandomMetadata
    nameSegments:
    - NamesNeoEclipseAgentLast
    nameFormat: name-format-neo-eclipse-agent
  - type: NpcFactionMember
    factions:
    - NeoEclipse

- type: randomHumanoidSettings
