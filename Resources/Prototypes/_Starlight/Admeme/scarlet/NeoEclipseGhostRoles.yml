# Neo-Eclipse ghost roles
# Admin spawns RandomHumanoidSpawnerNeoEclipseAgent via the Spawn Entities panel.
# Ghosts claim the role and spawn fully equipped.

- type: entity
  id: RandomHumanoidSpawnerNeoEclipseAgent
  name: Neo-Eclipse Agent
  suffix: Admeme
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/wardlord.rsi
    state: icon
  - type: RandomMetadata
    nameSegments:
    - NamesNeoEclipseAgentLast
    nameFormat: name-format-neo-eclipse-agent
  - type: RandomHumanoidSpawner
    settings: NeoEclipseAgent

- type: entity
  id: RandomHumanoidSpawnerNeoEclipseOperative
  name: Neo-Eclipse Operative
  suffix: Admeme
  components:
