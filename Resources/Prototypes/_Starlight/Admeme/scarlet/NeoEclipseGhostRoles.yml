# Agent — heavy combat, breach kit, high ammo load
- type: startingGear
  id: NeoEclipseAgentGear
  equipment:
    head: ClothingHeadHelmetNeoEclipse
    mask: ClothingMaskGasSwat
    outerClothing: ClothingOuterCombatSuitNeoEclipse
    jumpsuit: ClothingUniformJumpsuitColorBlack
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsJackFilled
    back: ClothingBackpackSatchel
    belt: ClothingBeltMilitaryWebbing
    id: NeoEclipseAgentPDA
    ears: ClothingHeadsetAltNeoEclipse
    eyes: ClothingEyesGlassesNeoEclipse
    pocket1: WeaponTaser
    pocket2: PinpointerUniversal
    suitstorage: WeaponRiflePrometheus
  storage:
    back:
    - RegenerativeMesh
    - MedicatedSuture
    - PunctAutoInjector
    - BurnAutoInjector
    - JawsOfLife
    - WelderIndustrialAdvanced
    - DoubleEmergencyOxygenTankFilled
    - DoubleEmergencyNitrogenTankFilled
    - FlashlightSeclite
    - PowerCellHyper
    - DrinkWaterBottleFull
    - FoodSnackNutribrick
    belt:
    - WeaponLaserSvalinn
    - MagazineRifleSP
    - MagazineRifleSP
    - MagazineRifleSP
    - MagazineRifleSP
    - GrenadeFlashBang
    - GrenadeFlashBang
    - Handcuffs

