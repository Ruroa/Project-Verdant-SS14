- type: onSignActions
  id: ElectromagneticStormInfinite
  actions:
    - !type:ActionAddGamerules
      rules:
        - ElectromagneticStorm
    - !type:ActionSetCharges
      charges: 1
    - !type:ActionClearSigners

- type: onSignActions
  id: AddSecretRule
  actions:
    - !type:ActionAddGamerules
      rules:
        - Secret
