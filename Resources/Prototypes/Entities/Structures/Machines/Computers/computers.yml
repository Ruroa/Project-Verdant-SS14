  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      disk_slot: !type:ContainerSlot {}
      pai_slot: !type:ContainerSlot {} # Starlight
  - type: GuideHelp
    guides:
    - ShuttleCraft

