- type: entity
  id: StationAiFixerComputer
  categories: [ ShouldMapStation ] # Starlight
  parent: BaseComputer
  name: AI restoration console
  description: Used to repair damaged artifical intelligences.
  components:
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: ai-fixer-empty
    - map: [ "computerLayerKeys" ]
      state: rd_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.StationAiFixerConsoleVisuals.Key:
        computerLayerScreen:
          Repair0: { state: ai-fixer-progress-0 }
          Repair1: { state: ai-fixer-progress-1 }
          Repair2: { state: ai-fixer-progress-2 }
          Repair3: { state: ai-fixer-progress-3 }
          Purge0: { state: ai-fixer-purge-0 }
          Purge1: { state: ai-fixer-purge-1 }
          Purge2: { state: ai-fixer-purge-2 }
          Purge3: { state: ai-fixer-purge-3 }
          Empty: { state: ai-fixer-empty }
          Occupied: { state: ai-fixer-full }
          Rebooting: { state: ai-fixer-404 }
          Dead: { state: ai-fixer-404 }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
      # Starlight Start
      enum.EdgeConnectionVisuals.ConnectionMask:
        computerLayerBody:
          None: { state: computer, sprite: Structures/Machines/computers.rsi }
          West: { state: computer_r, sprite: _Starlight/Structures/Machines/computers.rsi }
          East: { state: computer_l, sprite: _Starlight/Structures/Machines/computers.rsi }
          East, West: { state: computer_l_r, sprite: _Starlight/Structures/Machines/computers.rsi }
      # Starlight End
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 1000
  - type: Computer
    board: StationAiFixerCircuitboard
  - type: AccessReader
    access: [ [ "ResearchDirector" ] ]
  - type: Lock
    unlockOnClick: false
  - type: StationAiFixerConsole
  - type: ItemSlotsLock
    slots:
    - station_ai_holder
  - type: ItemSlotRequiresPower
  - type: ItemSlots
    slots:
      station_ai_holder:
        ejectOnBreak: true
        lockedFailPopup: station-ai-fixer-console-is-locked
        whitelistFailPopup: station-ai-fixer-console-station-ai-holder-required
        whitelist:
          requireAll: true
          components:
          - StationAiHolder
          - Item
  - type: ContainerContainer
    containers:
      station_ai_holder: !type:ContainerSlot
      board: !type:Container
  - type: ActivatableUI
    key: enum.StationAiFixerConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StationAiFixerConsoleUiKey.Key:
        type: StationAiFixerConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  # Starlight Start - Immersive Lighting PR
  - type: PointLight
    radius: 2.5
    energy: 1.5
    color: "#b834c9"
  # Starlight End

