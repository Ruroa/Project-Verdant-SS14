- type: constructionGraph
  id: PVTWall
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity { }
    edges:
    - to: straight
      steps:
      - material: Steel
        amount: 2
        doAfter: 4
    - to: corner
      steps:
      - material: Steel
        amount: 2
        doAfter: 4
    - to: end
      steps:
      - material: Steel
        amount: 2
        doAfter: 4
    - to: gate
      steps:
      - material: Steel
        amount: 2
        doAfter: 4

  - node: straight
    entity: PVTWallStraight
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity { }
      steps:
      - tool: Welding
        doAfter: 4

  - node: corner
    entity: PVTWallCorner
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity { }
      steps:
      - tool: Welding
        doAfter: 4

  - node: end
    entity: PVTWallEnd
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity { }
      steps:
      - tool: Welding
        doAfter: 4

  - node: gate
    entity: PVTWallGate
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity { }
      steps:
      - tool: Welding
        doAfter: 4
