# PV custom armory safe loadouts. These use their own prototypes so the standard safes remain available.

- type: entity
  parent: [PVGunSafeDisablerGrid, BaseSecurityContraband]
  id: GunSafePVDisabler
  name: disabler, taser, and flash safe
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: FillGunSafePVDisabler
- type: entityTable
  id: FillGunSafePVDisabler
  table: !type:AllSelector
    children:
    - id: WeaponDisabler
      amount: 5
    - id: WeaponTaser
      amount: 5
    - id: Flash
      amount: 5
