# PV-specific armory safe variants.
# These inherit the custom shaped storage grids in _PV/Entities/Structures/Storage/gunsafes.yml.
# Standard Starlight gun-safe prototypes remain unchanged.

- type: entity
  parent: [PVGunSafeM4Grid, BaseSecurityContraband]
  id: PVArmoryGunSafeM4
  name: M4 rifle safe
  components:
  - type: EntityStorageVisuals
    stateDoorClosed: lecter_gunsafe_doors
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: PVFillGunSafeM4

- type: entityTable
  id: PVFillGunSafeM4
  table: !type:AllSelector
    children:
    - id: WeaponRifleM4
      amount: 5
    - id: MagazinePV556
      amount: 10
    - id: MagazinePV556Rubber
      amount: 5
    - id: PVAmmoBox556
      amount: 4
    - id: WeaponPistolLA2
    - id: MagazinePV9x19
      amount: 2
    - id: MagazinePV9x19Rubber

