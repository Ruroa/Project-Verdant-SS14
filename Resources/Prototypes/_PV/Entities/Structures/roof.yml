- type: entity
  id: PVRoof
  name: roof
  description: A simple overhead roof that protects the tile below from weather.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  # Write directly to the grid's roof data, just like RoofMarker. SetRoof
  # deletes this helper entity after applying the roof flag.
  - type: SetRoof
    value: true
  # The completed roof is intentionally invisible. This icon is used by the
  # construction menu and its placement ghost.
  - type: Icon
    sprite: Markers/cross.rsi
    state: green
  - type: Sprite
    sprite: /Textures/Markers/cross.rsi
    layers:
    - state: green
      shader: unshaded

- type: entity
  id: PVNoRoof
  name: roof removal marker
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: SetRoof
    value: false
  - type: Icon
    sprite: Markers/cross.rsi
    state: red
  - type: Sprite
    sprite: /Textures/Markers/cross.rsi
    layers:
    - state: red
      shader: unshaded
