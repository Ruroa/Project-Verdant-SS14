- type: entity
  id: PVGunSafeStorageBase
  abstract: true
  parent: BaseStructure
  name: security gun safe
  components:
  - type: Sprite
    sprite: _PV/Structures/Storage/gunsafe.rsi
    noRot: true
    layers:
    - state: gunsafe
      map: ["enum.StorageVisualLayers.Base"]
    - state: gunsafe
      visible: false
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: gunsafe
    stateBaseOpen: gunsafe_open
  - type: LockVisuals
    stateLocked: locked
  - type: Lock
    unlockOnClick: false
    useAccess: true
    autoUnlock: false
    autoLock: false
    popupMessage: false
  - type: LockedStorage
  - type: AccessReader
    access: [["Armory"]]
  - type: Storage
    maxItemSize: Ginormous
    openOnActivate: true
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: Weldable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
  - type: InteractionOutline
  - type: StaticPrice
    price: 660

