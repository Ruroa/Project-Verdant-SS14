- type: entity
  abstract: true
  id: ZpmSocketVisualPart
  parent: BaseMachine
  name: ZPM module socket segment
  description: A segment of the Zero Point Module containment socket.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
  - type: Anchorable
  - type: Pullable

- type: entity
  parent: ZpmSocketVisualPart
  abstract: true
  id: ZpmSocketShieldCorner
  components:
  - type: NodeContainer
    nodes:
      shielding:
        !type:ZpmNodeShieldingCorner
        nodeGroupID: Zpm
  - type: ZpmShieldingCorner
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 2
  - type: DamageVisuals
    thresholds: [5, 10, 20, 40, 80]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  # Keep a depleted corner present so it can be rebuilt with steel and welded.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: ZpmSocketShieldCorner
  id: ZpmSocketTopLeft
  name: ZPM socket top-left segment
  components:
  - type: Sprite
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    state: corner-topleft

- type: entity
  parent: ZpmSocketVisualPart
  id: ZpmSocketTopMiddle
  name: ZPM socket top segment
  components:
  - type: NodeContainer
    nodes:
      shielding:
        !type:ZpmNodeShielding
        nodeGroupID: Zpm
  - type: Sprite
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    state: middle-top

- type: entity
  parent: ZpmSocketShieldCorner
  id: ZpmSocketTopRight
  name: ZPM socket top-right segment
  components:
  - type: Sprite
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    state: corner-topright

- type: entity
  parent: ZpmSocketVisualPart
  id: ZpmSocketHeatOutlet
  name: ZPM heat outlet segment
  components:
  - type: Sprite
    granularLayersRendering: true
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    layers:
    - state: middle-leftheatout
    - sprite: _Carpmosia/Structures/Piping/Atmospherics/thermomachine.rsi
      state: pipe
      map: [ "enum.PipeVisualLayers.Pipe" ]
      rotation: 270
      renderingStrategy: Default
  - type: NodeContainer
    examinable: true
    nodes:
      zpm:
        !type:ZpmNodeHeatOutlet
        nodeGroupID: Zpm
      shielding:
        !type:ZpmNodeShielding
        nodeGroupID: Zpm
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
        volume: 100
  - type: AtmosDevice
    joinSystem: true
  - type: Appearance
  - type: PipeColorVisuals
  - type: AtmosPipeColor
  - type: AtmosPipeLayers
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine.rsi
        Secondary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt1.rsi
        Tertiary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt2.rsi
        Quaternary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt3.rsi
        Quinary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt4.rsi
  - type: PipeRestrictOverlap

- type: entity
  parent: BaseMachinePowered
  id: ZpmModuleSocket
  name: ZPM module socket
  description: A shielded containment socket for a Zero Point Module core control unit.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    layers:
    - state: middle
    - state: stable-pulse-low
      map: [ "zpmPulse" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ZpmReactorVisuals.Pulse:
        zpmPulse:
          Offline: { visible: false }
          StableLow: { state: stable-pulse-low, visible: true }
          StableHigh: { state: stable-pulse-high, visible: true }
          WarningLow: { state: warning-pulse-low, visible: true }
          WarningHigh: { state: warning-pulse-high, visible: true }
          CriticalLow: { state: critical-pulse-low, visible: true }
          CriticalHigh: { state: critical-pulse-high, visible: true }
  - type: Anchorable
  - type: Pullable
  - type: ZpmReactor
  - type: AtmosDevice
    joinSystem: true
  - type: NodeContainer
    examinable: true
    nodes:
      zpm:
        !type:ZpmNodeReactor
        nodeGroupID: Zpm
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRate: 0
    supplyRampRate: 100000000
    supplyRampTolerance: 10000000000
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    state: middle
  - type: WiredNetworkConnection

- type: entity
  parent: BaseMachine
  id: ZpmController
  name: ZPM control
  description: Holds the removable Zero Point Module core and links it to the socket.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    state: control
    layers:
    - state: control
    - state: control-filled
      map: [ "zpmControllerFilled" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ZpmControllerVisuals.CoreInserted:
        zpmControllerFilled:
          True: { visible: true }
          False: { visible: false }
  - type: Anchorable
  - type: Pullable
  - type: ZpmController
    coreSlot:
      name: ZPM Core
      disableEject: true
      whitelist:
        components:
        - ZpmCore
      insertSuccessPopup: zpm-core-inserted
      lockedFailPopup: zpm-core-locked
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      coreSlot: !type:ContainerSlot
  - type: NodeContainer
    nodes:
      zpm:
        !type:ZpmNodeController
        nodeGroupID: Zpm
  - type: DeviceLinkSource
    ports:
    - Status

- type: entity
  parent: ZpmSocketVisualPart
  id: ZpmSocketCoolingInlet
  name: ZPM coolant inlet segment
  components:
  - type: Sprite
    granularLayersRendering: true
    sprite: _PV/Structures/Power/zpm_module_socket.rsi
    layers:
    - state: middle-rightcoolingin
    - sprite: _Carpmosia/Structures/Piping/Atmospherics/thermomachine.rsi
      state: pipe
      map: [ "enum.PipeVisualLayers.Pipe" ]
      rotation: 90
      renderingStrategy: Default
  - type: NodeContainer
    examinable: true
    nodes:
      zpm:
        !type:ZpmNodeCoolingInlet
        nodeGroupID: Zpm
      shielding:
        !type:ZpmNodeShielding
        nodeGroupID: Zpm
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: East
        volume: 100
  - type: AtmosDevice
    joinSystem: true
  - type: Appearance
  - type: PipeColorVisuals
  - type: AtmosPipeColor
  - type: AtmosPipeLayers
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine.rsi
        Secondary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt1.rsi
        Tertiary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt2.rsi
        Quaternary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt3.rsi
        Quinary: _Carpmosia/Structures/Piping/Atmospherics/thermomachine_alt4.rsi
  - type: PipeRestrictOverlap

- type: entity
  parent: ZpmSocketShieldCorner
