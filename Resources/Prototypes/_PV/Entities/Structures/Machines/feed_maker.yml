- type: entity
  id: PVFeedMaker
  parent: BaseMachinePowered
  name: feed maker
  description: Converts fresh botany produce into nutritious animal feed.
  components:
  - type: Sprite
    sprite: _PV/Structures/Machines/feedmaker.rsi
    snapCardinals: true
    layers:
    - state: feedmaker-off
    - state: feedmaker
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: FeedMaker
