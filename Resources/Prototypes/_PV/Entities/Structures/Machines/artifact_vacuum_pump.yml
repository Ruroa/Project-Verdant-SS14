- type: entity
  id: PVArtifactVacuumPump
  parent: GasBinaryBase
  name: artifact vacuum pump
  description: A high-powered Science pump that rapidly removes every gas from a sealed chamber.
  suffix: PV
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: VacuumPump
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    sprite: _Carpmosia/Structures/Piping/Atmospherics/pump.rsi
    layers:
    - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
      state: pipeStraight
      map: ["enum.PipeVisualLayers.Pipe"]
    - state: pumpVolume
      map: ["enum.SubfloorLayers.FirstLayer", "enabled"]
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: PVArtifactVacuumPump
      Secondary: PVArtifactVacuumPumpAlt1
      Tertiary: PVArtifactVacuumPumpAlt2
      Quaternary: PVArtifactVacuumPumpAlt3
      Quinary: PVArtifactVacuumPumpAlt4
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.VacuumPumpVisuals.Enabled:
        enabled:
          True: { state: pumpVolumeOn }
          False: { state: pumpVolume }
  - type: ActivatableUI
    key: enum.VacuumPumpUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.VacuumPumpUiKey.Key:
        type: VacuumPumpBoundUserInterface
  - type: Construction
    graph: GasBinary
    node: volumepump
  - type: PipeColorVisuals
  - type: AmbientSound
    enabled: false
    volume: -7
    range: 6
    sound:
      path: /Audio/Ambience/Objects/gas_pump.ogg
  - type: VentCrawlTube
  - type: VentCrawlTransit

- type: entity
  parent: [GasPipeLayerAlt1, PVArtifactVacuumPump]
  id: PVArtifactVacuumPumpAlt1
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Carpmosia/Structures/Piping/Atmospherics/pump_alt1.rsi
    layers:
    - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeStraight
      map: ["enum.PipeVisualLayers.Pipe"]
    - state: pumpVolume
      map: ["enum.SubfloorLayers.FirstLayer", "enabled"]
  - type: Construction
    node: volumepumpAlt1

