- type: entity
  id: PVArtifactVacuumPump
  parent: BaseWallmountMachine
  name: wall-mounted vacuum pump
  description: A directional pump that rapidly removes every gas from the airtight room it faces.
  suffix: PV
  components:
  - type: StationAiWhitelist
  - type: WallMount
    arc: 180
  - type: VacuumPump
  - type: AtmosDevice
    joinSystem: true
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _PV/Structures/Wallmounts/Vacpump.rsi
    state: vacpump
  - type: ActivatableUI
    key: enum.VacuumPumpUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.VacuumPumpUiKey.Key:
        type: VacuumPumpBoundUserInterface
  - type: AmbientSound
    enabled: false
    volume: -7
    range: 6
    sound:
      path: /Audio/Ambience/Objects/gas_pump.ogg
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
    prefix: device-address-prefix-gas-pump
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
