- type: entity
  id: PVMobReagentCowBicaridine
  parent: MobCow
  name: reagent cow
  suffix: Bicaridine
  description: A genetically unstable cow whose colour and udder contents reflect its dominant reagent.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _PV/Mobs/Animals/mutationcow.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "enum.ReagentCowVisualLayers.Base"]
      state: regrentcow
      color: "#ffaa00"
  - type: DamageStateVisuals
    states:
      Alive:
        Base: regrentcow
      Critical:
        Base: regrentcow-dead
      Dead:
        Base: regrentcow-dead
  - type: SolutionContainerManager
    solutions:
      udder:
        maxVol: 250
        reagents:
        - ReagentId: Bicaridine
          Quantity: 30
  - type: Udder
    reagentId: Bicaridine
    quantityPerUpdate: 25
    growthDelay: 30
  - type: ReagentCow
    reagent: Bicaridine
  - type: Reproductive
    partnerWhitelist:
      tags:
      - Cow
    offspring:
    - id: PVMobReagentCowBicaridine
