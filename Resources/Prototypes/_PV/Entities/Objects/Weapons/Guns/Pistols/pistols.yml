- type: entity
  name: M1984 service pistol
  parent: [ BaseWeaponPistol, BaseSecurityContraband ]
  id: WeaponPistolM1984PV
  description: A .45 ACP service pistol.
  components:
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Pistols/m1984.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _PV/Objects/Weapons/Guns/Pistols/m1984.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumSPPV
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnumSPPV
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeMagnum

