- type: entity
  abstract: true
  parent: BaseItem
  id: BasePVMagazine
  components:
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BasePVMagazine
  id: MagazinePV9x19
  name: pistol magazine (9x19mm)
  components:
  - type: Tag
    tags: [ PVMagazine9x19Tag, MagazinePistol ]
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 15
    proto: CartridgePV9x19Ball
    whitelist:
      tags: [ CartridgePistol ]
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammo/Magazines/Pistol/9x19_mag.rsi

