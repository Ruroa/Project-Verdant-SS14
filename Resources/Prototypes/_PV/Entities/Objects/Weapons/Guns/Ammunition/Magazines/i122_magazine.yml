- type: entity
  parent: [ BaseItem, BaseSecurityContraband ]
  id: MagazineI122
  name: I122 DMR magazine (7.62x51mm NATO)
  description: A 12-round magazine for the I122 designated marksman rifle.
  components:
  - type: Tag
    tags:
    - MagazineI122
    - MagazineHeavyRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeHeavyRifle
    proto: CartridgeHeavyRifleBall
    capacity: 12
  - type: Item
    inhandVisuals:
      left: []
      right: []
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Magazine/DMR/l122_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: ammo_band
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false
  - type: Appearance
