# Project Verdant visual replacements for common magazines. These inherit the
# existing caliber, ammunition whitelist, capacity, and compatibility tags.
- type: entity
  parent: MagazinePistolSP
  id: MagazinePistolSPPV
  name: 9x19mm pistol magazine
  components:
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/9x19_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Tag
    tags:
    - MagazinePistol
    - MagazinePistolSPPV
  - type: Item
    size: Small
    inhandVisuals:
      left: []
      right: []
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false

