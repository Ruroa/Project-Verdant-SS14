- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridge44Magnum
  name: cartridge (.44 Magnum)
  components:
  - type: Tag
    tags:
    - Cartridge44Magnum
  - type: CartridgeAmmo
    proto: BulletMagnumTraceSP
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Casings/44magnum.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  parent: BaseCartridge44Magnum
  id: Cartridge44Magnum
  name: cartridge (.44 Magnum Ball)
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#3F47DB"

- type: entity
  parent: BaseCartridge44Magnum
  id: Cartridge44MagnumAP
  name: cartridge (.44 Magnum AP)
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumTraceAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#0a0a0a"
