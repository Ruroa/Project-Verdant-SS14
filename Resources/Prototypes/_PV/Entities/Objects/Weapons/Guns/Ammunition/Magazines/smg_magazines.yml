- type: entity
  parent: [ BaseItem, BaseSecurityContraband ]
  id: MagazinePD90
  name: PD90 magazine (5.7x26mm)
  components:
  - type: Tag
    tags:
    - MagazinePD90
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge57x26
    proto: Cartridge57x26
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pd90_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

