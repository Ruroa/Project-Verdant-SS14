- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseMagazineBox44Magnum
  name: ammunition box (.44 Magnum)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge44Magnum
    proto: Cartridge44Magnum
    capacity: 12
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Boxes/44magnum.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineBox44Magnum
  id: MagazineBox44Magnum
  name: ammunition box (.44 Magnum Ball)
  description: A cardboard box of .44 Magnum revolver cartridges.
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ball

- type: entity
  parent: BaseMagazineBox44Magnum
  id: MagazineBox44MagnumAP
  name: ammunition box (.44 Magnum AP)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge44MagnumAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ap
