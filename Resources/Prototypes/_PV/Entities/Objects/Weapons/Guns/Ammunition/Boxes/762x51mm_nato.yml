- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseMagazineBoxHeavyRifle
  name: ammunition box (7.62x51mm NATO)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeHeavyRifle
    proto: CartridgeHeavyRifleBall
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Boxes/762x51mm_nato.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineBoxHeavyRifle
  id: MagazineBoxHeavyRifle
  name: ammunition box (7.62x51mm NATO Ball)
  description: A cardboard box of 7.62x51mm NATO ball cartridges.
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ball
