- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: MagazineBox57x26E
  name: ammunition box (5.7x26mm energized)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge57x26E
    proto: Cartridge57x26E
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammunition/Boxes/57x28mm.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: energized
      sprite: _PV/Objects/Weapons/Guns/Ammunition/Boxes/57x28mm-e.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

