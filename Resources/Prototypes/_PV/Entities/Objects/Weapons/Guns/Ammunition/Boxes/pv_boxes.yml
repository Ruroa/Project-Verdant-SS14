- type: entity
  abstract: true
  parent: BaseItem
  id: BasePVAmmoBox
  components:
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false

- type: entity
  parent: BasePVAmmoBox
  id: PVAmmoBox9x19
  name: ammunition box (9x19mm)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags: [ CartridgePistol ]
    capacity: 50
    proto: CartridgePV9x19Ball
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Ammo/Boxes/9x19_box.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: ball
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]

