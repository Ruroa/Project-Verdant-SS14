- type: entity
  abstract: true
  parent: BaseWeaponRifle
  id: BasePVRifle556
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        priority: 2
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags: [ PVMagazine556Tag ]
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ CartridgeRifle ]
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      firing_pin: !type:Container

- type: entity
  name: DT DMR L
  parent: [BasePVRifle556, BaseSecurityContraband]
  id: WeaponRifleDTMDR556
  description: A designated marksman rifle chambered in 5.56x45mm.
  components:
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Rifles/DTMDR556.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _PV/Objects/Weapons/Guns/Rifles/DTMDR556.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePV556
        priority: 2
        whitelist:
          tags: [ PVMagazine556Tag ]
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ CartridgeRifle ]

