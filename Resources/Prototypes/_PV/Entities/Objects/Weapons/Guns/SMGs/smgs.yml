- type: entity
  abstract: true
  parent: BaseWeaponSubMachineGun
  id: BasePVSMG
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        priority: 2
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
      gun_chamber:
        name: Chamber
        priority: 1
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      firing_pin: !type:Container

- type: entity
  name: MP27
  parent: [BasePVSMG, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponSMGMP27
  description: A compact 5.7x26mm submachine gun.
  components:
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/Smgs/mp27.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _PV/Objects/Weapons/Guns/Smgs/mp27.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    wieldingVisuals:
      left:
      - state: wielded-inhand-left
      right:
      - state: wielded-inhand-right
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePVMP27
        priority: 2
        whitelist:
          tags: [ PVMagazineMP27Tag ]
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ PVCartridge57Tag ]

