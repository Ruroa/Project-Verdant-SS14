- type: entity
  name: PD90 submachine gun
  parent: [ BaseWeaponSubMachineGun, BaseSecurityContraband ]
  id: WeaponSubMachineGunPD90
  description: A compact submachine gun chambered in standard 5.7x26mm ammunition.
  components:
  - type: Sprite
    sprite: _PV/Objects/Weapons/Guns/SMGs/pd90.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _PV/Objects/Weapons/Guns/SMGs/pd90.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePD90
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePD90
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - Cartridge57x26
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

