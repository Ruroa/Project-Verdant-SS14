- type: entity
  parent: FoodBase
  id: PVAnimalFeed
  name: animal feed
  description: Compressed feed for livestock. The standard variety is made from wheat.
  components:
  - type: Sprite
    sprite: _PV/Objects/Specific/Ranching/Feed.rsi
    layers:
    - state: feed
      map: [ "enum.AnimalFeedVisualLayers.Feed" ]
      color: white
  - type: Item
    sprite: _PV/Objects/Specific/Ranching/Feed.rsi
    size: Tiny
  - type: AnimalFeed
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Flour
          Quantity: 10
  - type: FlavorProfile
    flavors:
    - chalky
  - type: Tag
    tags:
    - Ruminant

- type: entity
  parent: BaseItem
  id: PVAnimalAnalyzer
  name: animal analyzer
  description: A handheld scanner that displays an animal's food, water, age, and breeding status.
  components:
  - type: Sprite
    sprite: _PV/Objects/Specific/Ranching/animalanalyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    sprite: _PV/Objects/Specific/Ranching/animalanalyzer.rsi
    heldPrefix: analyzer
    storedRotation: -90
  - type: ActivatableUI
    key: enum.AnimalAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AnimalAnalyzerUiKey.Key:
        type: AnimalAnalyzerBoundUserInterface
  - type: AnimalAnalyzer
