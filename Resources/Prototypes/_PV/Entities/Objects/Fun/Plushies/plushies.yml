# When adding new plushies, also add them to id: AllPlushiesTable
- type: entity
  parent: PlushieShadekin
  id: Desiresplushies
  name: Desires Plushie
  description: This plush looks like Desires The CEO of Verdant Terrasolutions. He is very soft.
  components:
  - type: Sprite
    sprite: _PV/Objects/Fun/Plushies/Desires_plushie.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _PV/Objects/Fun/Plushies/Desires_plushie.rsi

- type: entity
  parent: PlushieVulp
  id: Randallplushie
  name: Randall Hunt Plushie
  description: A perfect plushie copy of Randall Hunt. Extremely soft, perfect to put on your head.
  components:
  - type: Sprite
    sprite: _PV/Objects/Fun/Plushies/Randall_Hunt_plushie.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _PV/Objects/Fun/Plushies/Randall_Hunt_plushie.rsi
  - type: Clothing
    quickEquip: false
    sprite: _PV/Objects/Fun/Plushies/Randall_Hunt_plushie.rsi
    slots:
    - HEAD

- type: entity
  parent: BasePlushie
  id: PVCinderPlushie
  name: Cinder Plushie
  description: An adorable stuffed toy resembling Cinder. Soft, feathery, and prone to indignant squawking.
  components:
  - type: Sprite
    sprite: _PV/Objects/Fun/Plushies/cinderplushie.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _PV/Objects/Fun/Plushies/cinderplushie.rsi
  - type: Clothing
    quickEquip: false
    sprite: _PV/Objects/Fun/Plushies/cinderplushie.rsi
    slots:
    - HEAD
  - type: EmitSoundOnUse
    sound: &CinderSquawk
      collection: ResomiSquawk
  - type: EmitSoundOnActivate
    sound: *CinderSquawk
  - type: MeleeWeapon
    attackRate: 1
    wideAnimationRotation: 180
    soundHit:
      collection: PVCinderPlushieScreams
    damage:
      types:
        Blunt: 0
    hidden: true

- type: soundCollection
  id: PVCinderPlushieScreams
  files:
  - /Audio/_Starlight/Effects/avali_scream.ogg
  - /Audio/_Starlight/Voice/Resomi/resomi_scream.ogg
