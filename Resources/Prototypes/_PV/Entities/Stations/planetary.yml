- type: entity
  id: PVPlanetaryStation
  parent: StandardNanotrasenStation
  categories: [ HideSpawnMenu ]
  components:
  - type: StationCargoShuttle
    enabled: false
  - type: PlanetarySurfaceWreckSpawn
    minCount: 1
    maxCount: 2
    minimumDistance: 140
    maximumDistance: 260
    paths:
    - /Maps/Ruins/derelict.yml
    - /Maps/Ruins/ruined_prison_ship.yml
    - /Maps/Ruins/syndicate_dropship.yml
    - /Maps/Salvage/medium-crashed-shuttle.yml
  - type: OrbitalAccessPoint
    mapPath: /Maps/_PV/Orbitalaccesspoint/Orbitalaccesspoint.yml
    spawnGroups:
      cargo_salvage_shuttle: !type:GridSpawnGroup
        nameGrid: false
        paths:
        - /Maps/_Starlight/Shuttles/Salvage/expeditioneer.yml
      orbital_derelicts: !type:GridSpawnGroup
        minCount: 1
        maxCount: 2
        stationGrid: false
        randomRotation: true
        paths:
        - /Maps/Ruins/derelict.yml
      orbital_asteroids: !type:DungeonSpawnGroup
        minimumDistance: 150
        maximumDistance: 300
        minCount: 2
        maxCount: 4
        stationGrid: false
        directDungeonSpawn: true
        randomRotation: true
        addComponents:
        - type: Gravity
          enabled: true
          inherent: true
        - type: IFF
          flags: HideLabel
          color: "#88b0d1"
        protos:
        - ClusterAsteroid
        - SpindlyAsteroid
        - BlobAsteroid
        - SwissCheeseAsteroid
