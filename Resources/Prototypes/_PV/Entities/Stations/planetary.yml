- type: entity
  id: PVPlanetaryStation
  parent: StandardNanotrasenStation
  categories: [ HideSpawnMenu ]
  components:
  - type: OrbitalAccessPoint
    mapPath: /Maps/_PV/Orbitalaccesspoint/Orbitalaccesspoint.yml
    spawnGroups:
      trade: !type:GridSpawnGroup
        addComponents:
        - type: ProtectedGrid
        - type: TradeStation
        paths:
        - /Maps/_Starlight/trading_outpost.yml
      cargo_salvage_shuttle: !type:GridSpawnGroup
        nameGrid: false
        paths:
        - /Maps/_Starlight/Shuttles/Salvage/expeditioneer.yml
      cargo_mining_shuttle: !type:GridSpawnGroup
        nameGrid: false
        paths:
        - /Maps/_Starlight/Shuttles/Mining/asteroidcracker.yml
      orbital_derelicts: !type:GridSpawnGroup
        minCount: 1
        maxCount: 2
        stationGrid: false
        paths:
        - /Maps/Ruins/derelict.yml
      orbital_asteroids: !type:DungeonSpawnGroup
        minimumDistance: 150
        maximumDistance: 300
        minCount: 2
        maxCount: 4
        stationGrid: false
        addComponents:
        - type: Gravity
          enabled: true
          inherent: true
        - type: IFF
          flags: HideLabel
          color: "#88b0d1"
        protos:
        - ClusterAsteroid
        - SpindlyAsteroid
        - BlobAsteroid
        - SwissCheeseAsteroid
